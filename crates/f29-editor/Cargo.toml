[package]
name = "f29-editor"
description = "Karteneditor für die Einsatzgebiete von F-29 Silent Sniper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
f29-core.workspace = true
f29-render.workspace = true
f29-world.workspace = true
# Fensterprogramm von egui, ohne Bevy; wgpu und winit in denselben Versionen wie Bevy.
# persistence: zuletzt bearbeitete Datei, Unterlagen und Fenstergröße merken.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence"] }
png = "0.18"

[lints]
workspace = true
