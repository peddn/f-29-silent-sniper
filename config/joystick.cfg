# Joystick-Belegung für F-29 Silent Sniper
#
# Voreinstellung: Logitech Extreme 3D Pro unter Linux. Das Spiel liest diese
# Datei als `joystick.cfg` aus dem Startverzeichnis (oder mit
# `--joystick DATEI`); ohne Datei gilt genau diese Belegung.
#
# Welche Achse und welche Taste der Stick meldet, zeigt
#     f29-silent-sniper --joystick-debug
# auf der Konsole – in derselben Schreibweise wie hier.
#
# Achsen:  X, Y, Z, RX, RY, RZ, `ABS n` (Linux-Achsennummer, z. B. ABS 6 =
#          Schubregler), `RAW n` (Rohkennung); dahinter optional `invert`.
#          `-` = keine Achse.
# Tasten:  B1 … B16 (Nummern wie auf dem Stick), HatUp, HatRight, HatDown,
#          HatLeft, Gamepad-Namen (South, East, …, Start, Select) oder `RAW n`.
#          Eine Aktion darf mehrere Zeilen haben.

# Knüppel, Drehgriff, Schubregler
roll     = X
pitch    = Y invert
yaw      = RZ
throttle = ABS 6 invert
# Ausschlag, unter dem Knüppel und Drehgriff als Mitte gelten (0 … 0,5)
deadzone = 0.08

# Waffen
gun             = B1   # Kanone (gehalten), gleich welche Waffe gewählt ist
fire            = B2   # gewählte Waffe auslösen; Kanone gehalten
next_weapon     = B3   # GUN → BAY 1 … BAY 4
bay_doors       = B4   # Schachtklappen auf/zu

# Sensoren und Navigation
radar           = B5
next_steerpoint = B6
look_forward    = HatUp
look_right      = HatRight
look_aft        = HatDown
look_left       = HatLeft

# Flugzeug
gear            = B7
flaps           = B8
airbrake        = B9

# Anzeigen
map_zoom        = B10  # Kartenmaßstab reihum
mfd_page        = B11  # rechtes MFD: nächste Seite
hud_mode        = B12  # NAV → AG → AA

# Frei belegbar, ohne Voreinstellung: view (Cockpit/Verfolger), pause,
# map_mode (Gitter/Satellit), zoom_in, zoom_out
